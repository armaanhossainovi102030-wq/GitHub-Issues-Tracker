<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>log in</title>
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
</head>
<body>
   <section >
     <div class="hero bg-base-200 min-h-screen ">
  <div class="hero-content flex-col lg:flex-row-reverse">
    
    <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl">
      <div class="card-body ">
        <img class="object-cover w-1/4 mx-auto " src="./assets/github-logo.png" alt="">
        <h2 class="text-center text-2xl font-bold">GitHub Issues Tracker</h2>
        <h2 class="text-center">Sign in to manage your issues</h2>
        <fieldset class="fieldset">
          <label class="font-bold">Username</label>
          <input id="username" type="text" class="input" placeholder="Enter Username" />
         <p class="text-violet-500">Default: admin</p>

          <label class="font-bold">Password</label>
          <input id="password" type="password" class="input" placeholder="Enter Password" />
         <p  class="text-violet-500">Default: admin123</p>
          <button onclick="login()" class="btn bg-blue-800 rounded-xl text-white mt-4">Sign In</button>
        </fieldset>
      </div>
    </div>
  </div>
</div>
   </section>

    <script src="./script.js"></script>
</body>
</html>
